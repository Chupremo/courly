<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#001A47"><title>Register Your Sports Club | Courtly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/courtly-global-nav.css?v=clubs-20261106"><style>:root{--navy:#001A47;--lime:#8ED502;--ink:#172744;--muted:#687891;--line:#e3eaf3}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:14px Inter,Arial}.wrap{width:min(850px,calc(100% - 32px));margin:36px auto 70px}.intro{text-align:center;margin-bottom:24px}.eyebrow{color:#6b9900;font-size:11px;font-weight:800;letter-spacing:.15em}.intro h1{font:700 clamp(28px,4vw,40px) Poppins;margin:9px 0;color:var(--navy)}.intro p{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 16px 45px #001a4710}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{min-width:0}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}.field input,.field select,.field textarea{width:100%;border:1px solid #d7e0ec;border-radius:9px;background:#fbfcfe;color:var(--ink);padding:12px;font:13px Inter;min-height:45px}.field textarea{min-height:115px;resize:vertical}.terms{display:flex;gap:10px;align-items:flex-start;margin:20px 0;color:#596982;font-size:12px;line-height:1.6}.submit{width:100%;height:49px;background:var(--lime);color:#152800;border:0;border-radius:10px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:13px;border-radius:10px;font-size:12px;line-height:1.5}.msg.show{display:block}.error{background:#fff0f0;color:#a72b35}.success{background:#eaf8ef;color:#176b44}.below{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.below a{color:var(--navy);font-weight:700}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:19px}.wrap{margin-top:24px}}</style></head><body><header id="courtlyGlobalHeader" class="courtly-global-header"></header><main class="wrap"><header class="intro"><div class="eyebrow">JOIN THE COURTLY NETWORK</div><h1>Register your sports club</h1><p>Create your club profile so players can discover your community, sports programs and location.</p></header><form class="card" id="clubForm"><div class="grid"><div class="field"><label for="clubName">Club name *</label><input id="clubName" required maxlength="120" placeholder="e.g. Lipa Pickleball Club"></div><div class="field"><label for="sport">Primary sport *</label><select id="sport" required><option value="">Select sport</option><option>Pickleball</option><option>Badminton</option><option>Basketball</option><option>Tennis</option><option>Volleyball</option><option>Football</option><option>Swimming</option><option>Multi-sport</option><option>Other</option></select></div><div class="field"><label for="city">City / Province *</label><input id="city" required maxlength="100" placeholder="e.g. Lipa City, Batangas"></div><div class="field"><label for="location">Club address / meeting location *</label><input id="location" required maxlength="180" placeholder="Barangay, sports center or meeting place"></div><div class="field"><label for="phone">Contact number *</label><input id="phone" required type="tel" maxlength="30" placeholder="09XX XXX XXXX"></div><div class="field"><label for="website">Website or social page</label><input id="website" type="url" maxlength="250" placeholder="https:// or Facebook page URL"></div><div class="field full"><label for="description">About your club *</label><textarea id="description" required maxlength="1200" placeholder="Tell players about your club, activities, skill levels and how to join."></textarea></div><div class="field"><label for="email">Club email *</label><input id="email" type="email" required autocomplete="email" placeholder="club@example.com"></div><div class="field"><label for="confirmEmail">Confirm email *</label><input id="confirmEmail" type="email" required placeholder="Re-enter email"></div><div class="field"><label for="password">Password *</label><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field"><label for="confirmPassword">Confirm password *</label><input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Re-enter password"></div></div><label class="terms"><input type="checkbox" id="terms" required><span>I confirm I am authorized to represent this club and agree to Courtly's Terms &amp; Conditions and Privacy Notice.</span></label><button class="submit" id="submit" type="submit">Create Club Account</button><div class="msg" id="message" role="alert" aria-live="polite"></div></form><p class="below">Already registered? <a href="/browse-clubs.html">Browse clubs</a> · <a href="/players.html">Explore venues</a></p></main><script type="module" src="/club-register.js"></script><script type="module" src="/courtly-global-nav.js?v=player-home-20261106"></script></body></html>
