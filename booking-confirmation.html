<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f45"><title>Booking received | Courtly"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--navy:#0b1d3d;--blue:#1747ad;--red:#e0474b;--ink:#172342;--muted:#748099;--line:#e6ebf3;--bg:#f5f7fb;--green:#16834a;--amber:#a86408}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px Poppins,Arial,sans-serif}body *{font-weight:400!important}h1,h2,h3,h4{font-weight:700!important}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{height:68px;background:var(--navy);color:white;display:flex;align-items:center}header .wrap{display:flex;align-items:center;justify-content:space-between}.logo{color:white;text-decoration:none;font-size:23px;letter-spacing:-1px}.logo span{color:#e0474b}header a.navlink{color:#dce6f7;text-decoration:none;font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;margin:36px auto;padding:30px;box-shadow:0 16px 45px #10254a0d}.status{text-align:center;padding:10px 10px 22px}.check{width:66px;height:66px;border-radius:50%;background:#e8f7ee;color:var(--green);display:grid;place-items:center;font-size:34px;margin:0 auto 15px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:2px}.status h1{font-size:30px;line-height:1.2;margin:10px 0}.status p{color:var(--muted);line-height:1.7;max-width:530px;margin:0 auto}.pill{display:inline-block;background:#fff4df;color:var(--amber);border-radius:30px;padding:7px 13px;font-size:11px;margin-top:15px}.ref{background:#f4f7fc;border:1px dashed #cdd8e9;border-radius:12px;padding:14px;text-align:center;margin:15px 0 24px}.ref small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.ref strong{font-size:18px;letter-spacing:.5px}.section-title{font-size:16px;margin:22px 0 12px}.details{border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}.row span:first-child{color:var(--muted)}.row strong{text-align:right}.total{font-size:15px;color:var(--navy)}.next{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:23px}.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px 15px;font-size:12px}.primary{background:var(--blue);color:white}.secondary{border:1px solid #d6deeb;color:var(--navy)}.notice{font-size:11px;color:var(--muted);line-height:1.7;margin-top:19px;background:#f7f9fc;padding:13px;border-radius:10px}.error{padding:35px;text-align:center;color:var(--muted)}footer{text-align:center;color:#929db0;font-size:10px;padding:10px 0 30px}@media(max-width:540px){.card{padding:20px;margin:20px auto}.status h1{font-size:25px}.next{grid-template-columns:1fr}.row{font-size:11px}}
</style></head><body><header><div class="wrap"><a class="logo" href="/">COURT<span>LY</span></a><a class="navlink" href="/players.html">Find courts</a></div></header><main class="wrap"><section class="card" id="content"><div class="error">Loading your booking details…</div></section></main><footer>© 2026 Courtly · Book. Play. Grow.</footer><script>
const KEY='courtlyPublicBookingsV1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});const params=new URLSearchParams(location.search);const ref=params.get('ref');let all=[];try{all=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const b=all.find(x=>String(x.id)===String(ref));const el=document.getElementById('content');
if(!b){el.innerHTML='<div class="error"><h1>Booking details unavailable</h1><p>This booking may have been created on another device, or browser storage was cleared.</p><a class="btn primary" href="/players.html">Find courts</a></div>';}else{const date=new Date((b.date||'')+'T00:00:00');const prettyDate=isNaN(date)?b.date:date.toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'});el.innerHTML=`<div class="status"><div class="check">✓</div><div class="eyebrow">COURTLY BOOKING REQUEST</div><h1>Payment receipt submitted!</h1><p>Your booking request has been received. The venue needs to verify your GCash payment before your reservation is confirmed.</p><span class="pill">Pending payment verification</span></div><div class="ref"><small>YOUR BOOKING REFERENCE</small><strong>${esc(b.id)}</strong></div><h2 class="section-title">Booking details</h2><div class="details"><div class="row"><span>Venue</span><strong>${esc(b.venue)}</strong></div><div class="row"><span>Court</span><strong>${esc(b.courtName||('Court '+b.court))}</strong></div><div class="row"><span>Date</span><strong>${esc(prettyDate)}</strong></div><div class="row"><span>Time</span><strong>${esc(b.time)}</strong></div><div class="row"><span>Duration</span><strong>${esc(b.duration)} hour(s)</strong></div><div class="row"><span>Player</span><strong>${esc(b.playerName)}</strong></div><div class="row"><span>Payment method</span><strong>${esc(b.paymentMethod||'GCash')}</strong></div><div class="row"><span>Payment status</span><strong>Pending verification</strong></div><div class="row"><span>Total submitted</span><strong class="total">${money(b.price)}</strong></div></div><div class="next"><a class="btn primary" href="/my-bookings.html">View My Bookings</a><a class="btn secondary" href="/players.html">Find more courts</a></div><div class="notice"><strong>What happens next?</strong><br>1. The venue reviews your uploaded receipt.<br>2. Once approved, your booking status changes to Confirmed.<br>3. Keep your booking reference for follow-up. This prototype currently stores booking history in this browser only.</div>`;}
</script></body></html>
