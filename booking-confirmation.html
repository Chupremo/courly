<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f45"><title>Booking received | Courtly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--navy:#0b1d3d;--blue:#1747ad;--red:#e0474b;--ink:#172342;--muted:#748099;--line:#e6ebf3;--bg:#f5f7fb;--green:#16834a;--amber:#a86408}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px Poppins,Arial,sans-serif}body *{font-weight:400!important}h1,h2,h3,h4{font-weight:700!important}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{height:68px;background:var(--navy);color:white;display:flex;align-items:center}header .wrap{display:flex;align-items:center;justify-content:space-between}.logo{color:white;text-decoration:none;font-size:23px;letter-spacing:-1px}.logo span{color:#e0474b}header a.navlink{color:#dce6f7;text-decoration:none;font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;margin:36px auto;padding:30px;box-shadow:0 16px 45px #10254a0d}.status{text-align:center;padding:10px 10px 22px}.check{width:66px;height:66px;border-radius:50%;background:#e8f7ee;color:var(--green);display:grid;place-items:center;font-size:34px;margin:0 auto 15px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:2px}.status h1{font-size:30px;line-height:1.2;margin:10px 0}.status p{color:var(--muted);line-height:1.7;max-width:530px;margin:0 auto}.pill{display:inline-block;background:#fff4df;color:var(--amber);border-radius:30px;padding:7px 13px;font-size:11px;margin-top:15px}.ref{background:#f4f7fc;border:1px dashed #cdd8e9;border-radius:12px;padding:14px;text-align:center;margin:15px 0 24px}.ref small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.ref strong{font-size:18px;letter-spacing:.5px}.section-title{font-size:16px;margin:22px 0 12px}.details{border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:flex;justify-content:space-between;gap:15px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border:0}.row span:first-child{color:var(--muted)}.row strong{text-align:right}.total{font-size:15px;color:var(--navy)}.next{dis
