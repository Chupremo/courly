<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001A47">
  <title>Build Your Player Profile | Courtly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/courtly-brand.css">
  <link rel="stylesheet" href="/courtly-responsive.css">
  <style>
  :root{--navy:#0b1733;--blue:#001A47;--red:#df454d;--ink:#17233e;--muted:#718099;--line:#e2e8f1}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8f9fc,#f1f4f9);font-family:Inter,Arial,sans-serif;color:var(--ink)}
  .page{width:min(680px,calc(100% - 30px));margin:auto;padding:28px 0 54px}.brand-wrap{text-align:center;margin-bottom:18px}.brand img{max-width:170px}
  .intro{text-align:center;margin-bottom:18px}.intro h1{font:700 30px Poppins;margin:0 0 8px;color:var(--navy)}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 18px 48px rgba(20,38,75,.08)}
  .profile-top{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid #eef1f6;margin-bottom:18px}.avatar{width:76px;height:76px;border-radius:50%;overflow:hidden;background:#eef2f8;display:grid;place-items:center;font-weight:800;color:var(--blue);font-size:24px;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.profile-meta strong{display:block;font-size:15px;color:var(--navy)}.profile-meta span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 7px}.field input,.field select{width:100%;height:44px;border:1px solid #cfd8e6;border-radius:9px;padding:0 12px;font:13px Inter;background:#fbfcfe}.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #001A4715}
  .privacy{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:#53617a}.privacy input{margin-top:2px;accent-color:var(--blue)}
  .submit{width:100%;height:48px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;margin-top:18px;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:12px}.msg.show{display:block}.msg.error{background:#fff0f0;color:#a32730}.msg.success{background:#eaf8f0;color:#176b44}
  @media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:18px}.intro h1{font-size:26px}}
  </style>
</head>
<body>
<main class="page">
  <div class="brand-wrap"><a class="brand" href="/"><img class="courtly-brand-logo" src="/assets/courtly-logo.png" alt="Courtly"></a></div>
  <section class="intro"><h1>Build your player profile</h1><p>We imported what we could from your social account. Add the details Courtly needs so other players can recognise you.</p></section>
  <form class="card" id="profileForm">
    <div class="profile-top">
      <div class="avatar" id="avatar">C</div>
      <div class="profile-meta"><strong id="socialName">Courtly Player</strong><span id="socialEmail"></span></div>
    </div>
    <div class="grid">
      <div class="field"><label for="fullName">Full Name *</label><input id="fullName" maxlength="100" required></div>
      <div class="field"><label for="playerName">Player Name *</label><input id="playerName" maxlength="40" required></div>
      <div class="field"><label for="phone">Contact Number</label><input id="phone" type="tel" maxlength="30" placeholder="09XX XXX XXXX"></div>
      <div class="field"><label for="skillLevel">Skill Level *</label><select id="skillLevel" required><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option><option>Professional</option></select></div>
      <div class="field full"><label for="preferredSport">Preferred Sport</label><select id="preferredSport"><option value="">Select a sport</option><option>Pickleball</option><option>Basketball</option><option>Tennis</option><option>Badminton</option><option>Volleyball</option><option>Padel</option><option>Other</option></select></div>
      <div class="field full"><label for="publicLocation">City / Area</label><input id="publicLocation" maxlength="100" placeholder="e.g. Lipa City, Batangas"></div>
    </div>
    <label class="privacy"><input type="checkbox" id="isPrivate"> Keep my player profile private from public player listings.</label>
    <button class="submit" id="submitButton" type="submit">Finish Profile</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
</main>
<script type="module">
import { supabase } from './supabase-client.js';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
function safeReturnTo(value){if(!value||!value.startsWith('/')||value.startsWith('//'))return '/player-dashboard.html?welcome=1';try{const u=new URL(value,location.origin);return u.origin===location.origin?u.pathname+u.search+u.hash:'/player-dashboard.html?welcome=1'}catch{return '/player-dashboard.html?welcome=1'}}
const returnTo=safeReturnTo(params.get('returnTo'));
const show=(text,type='error')=>{const m=$('msg');m.textContent=text;m.className='msg show '+type};
function metadataValue(meta,...keys){for(const key of keys){const value=String(meta?.[key]||'').trim();if(value)return value}return ''}
async function waitForOAuthSession(){
  const callbackError=params.get('error_description')||params.get('error');
  if(callbackError)throw new Error(decodeURIComponent(callbackError.replace(/\+/g,' ')));
  let subscription;
  let resolveAuth;
  const authReady=new Promise(resolve=>{resolveAuth=resolve});
  const listener=supabase.auth.onAuthStateChange((event,session)=>{
    if(session?.user&&['SIGNED_IN','INITIAL_SESSION','TOKEN_REFRESHED'].includes(event))resolveAuth(session);
  });
  subscription=listener.data?.subscription;
  try{
    for(let attempt=0;attempt<16;attempt++){
      const {data,error}=await supabase.auth.getSession();
      if(data?.session?.user)return data.session;
      if(error&&attempt===15)throw error;
      const eventSession=await Promise.race([authReady,new Promise(resolve=>setTimeout(()=>resolve(null),400))]);
      if(eventSession?.user)return eventSession;
    }
  }finally{subscription?.unsubscribe()}
  return null;
}
async function bootstrap(){
  if(!supabase){show('Profile setup is temporarily unavailable. Please try again later.');return}
  let session;
  try{session=await waitForOAuthSession()}catch(error){show('Google sign-in could not be completed: '+(error.message||'Authentication failed')+' Please try again.');return}
  if(!session?.user){
    show('Google returned you to Courtly, but Supabase did not provide an active sign-in session. Please try again. If this keeps happening, contact Courtly support. You have not been logged in.');
    return;
  }
  const user=session.user, meta=user.user_metadata||{};
  const fullName=metadataValue(meta,'full_name','name')||user.email?.split('@')[0]||'';
  const playerName=metadataValue(meta,'player_name','preferred_username','name','full_name')||fullName;
  const avatarUrl=metadataValue(meta,'avatar_url','picture');
  $('fullName').value=fullName;$('playerName').value=playerName;$('socialName').textContent=playerName||fullName||'Courtly Player';$('socialEmail').textContent=user.email||'';
  if(avatarUrl)$('avatar').innerHTML='<img alt="Profile picture" src="'+avatarUrl.replace(/"/g,'&quot;')+'">';else $('avatar').textContent=(playerName||fullName||'C').slice(0,1).toUpperCase();
  const {data:existing,error:profileError}=await supabase.from('player_profiles').select('*').eq('id',user.id).maybeSingle();
  if(profileError){show('You are signed in, but Courtly could not load your player profile: '+profileError.message);return}
  if(existing){
    $('fullName').value=existing.full_name||fullName;$('playerName').value=existing.player_name||playerName;$('phone').value=existing.phone||'';$('skillLevel').value=existing.skill_level||'Intermediate';$('preferredSport').value=existing.preferred_sport||'';$('publicLocation').value=existing.public_location||'';$('isPrivate').checked=Boolean(existing.is_private);
    const complete=Boolean(existing.full_name&&existing.player_name&&existing.skill_level);
    if(params.get('mode')==='login'&&complete){location.replace(returnTo);return}
  }
  // Remove OAuth callback parameters only after the session has been recovered.
  history.replaceState({},document.title,location.pathname+'?social=1&mode='+encodeURIComponent(params.get('mode')||'')+'&returnTo='+encodeURIComponent(returnTo));
}
$('profileForm').addEventListener('submit',async e=>{
  e.preventDefault(); if(!supabase||!e.currentTarget.reportValidity())return;
  const button=$('submitButton');button.disabled=true;button.textContent='Saving profile…';
  try{
    const {data:{user},error:userError}=await supabase.auth.getUser(); if(userError||!user)throw userError||new Error('Please sign in again.');
    const meta=user.user_metadata||{}; const avatarUrl=metadataValue(meta,'avatar_url','picture')||null;
    const record={id:user.id,full_name:$('fullName').value.trim(),player_name:$('playerName').value.trim(),email:String(user.email||'').toLowerCase(),phone:$('phone').value.trim()||null,skill_level:$('skillLevel').value,is_private:$('isPrivate').checked,preferred_sport:$('preferredSport').value||null,public_location:$('publicLocation').value.trim()||null,avatar_url:avatarUrl,updated_at:new Date().toISOString()};
    const response=await fetch('/api/auth/player-social-profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(await supabase.auth.getSession()).data.session.access_token},body:JSON.stringify(record)});
    const result=await response.json().catch(()=>({})); if(!response.ok)throw new Error(result.error||'Could not save your profile.');
    show('Profile ready. Opening Courtly…','success'); setTimeout(()=>location.replace(returnTo),450);
  }catch(error){show(error.message||'Could not save your profile.');button.disabled=false;button.textContent='Finish Profile'}
});
bootstrap();
</script>
</body></html>
