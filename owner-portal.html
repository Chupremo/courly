<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courtly Owner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Courtly Premium Theme: midnight navy · champagne gold · ivory ============ */
:root{--navy:#0a1128;--navy2:#131c3a;--ink:#101828;--muted:#6b7280;--bg:#f6f4ef;--surface:#fff;--line:#e9e4d9;--gold:#8ED502;--gold2:#A3E52A;--goldsoft:#f6efe0;--emerald:#1d7a58;--ruby:#b3394a;--shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.16);--r:16px;--serif:Fraunces,Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(176,141,87,.45);outline-offset:2px}
.hidden{display:none!important}

/* Layout */
.app{min-height:100vh;display:grid;grid-template-columns:268px minmax(0,1fr)}
.main{min-width:0}
.content{width:100%;max-width:1800px;margin:0 auto;padding:36px 40px 72px}

/* Sidebar */
.side{background:radial-gradient(120% 60% at 0% 0%,rgba(217,189,133,.14),transparent 60%),linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:30px 18px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid rgba(217,189,133,.12)}
.brand{font:600 27px var(--serif);letter-spacing:.14em;padding:0 14px 30px}
.brand span{color:var(--gold2)}.brand-logo{display:block;max-width:190px;max-height:64px;object-fit:contain;object-position:left center;margin:0 14px 5px}.brand-powered{display:block;padding:0 14px 24px;font-size:9px;letter-spacing:.09em;color:#9ba8c2;text-transform:uppercase;font-weight:600}.brand-wordmark{display:block}
.side small{color:rgba(255,255,255,.42);font-weight:600;letter-spacing:.2em;font-size:10.5px;padding:6px 14px 12px}
.navlist{display:flex;flex-direction:column;gap:3px}
.navbtn{border:0;background:transparent;color:rgba(255,255,255,.7);text-align:left;padding:12px 14px;border-radius:12px;font-weight:500;font-size:14px;min-height:44px;position:relative;transition:background .2s,color .2s}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.active{background:linear-gradient(90deg,rgba(217,189,133,.2),rgba(217,189,133,.05));color:var(--gold2);font-weight:600}
.navbtn.active:before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:3px;background:var(--gold2)}
.side-bottom{margin-top:auto;padding:16px 14px 0;color:rgba(255,255,255,.55);font-size:11.5px;letter-spacing:.04em;border-top:1px solid rgba(255,255,255,.09)}
.side-bottom span{color:rgba(217,189,133,.75)!important}

/* Topbar */
.topbar{height:78px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:16px;position:sticky;top:0;z-index:15}
.crumb{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.topbar h2{margin:2px 0 0;font:600 21px var(--serif);letter-spacing:-.01em;color:var(--navy)}
.topright{display:flex;align-items:center;gap:12px}
.owner-email{font-weight:500}
.avatar{width:40px;height:40px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);display:grid;place-items:center;border-radius:50%;font-weight:700;font-size:13px;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}

/* Headings */
.eyebrow{color:var(--gold);letter-spacing:.2em;font-size:11px;font-weight:700;text-transform:uppercase}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.heading h1{font:500 clamp(30px,3.2vw,42px)/1.15 var(--serif);letter-spacing:-.02em;margin:8px 0 6px;color:var(--navy)}
.heading p{color:var(--muted);margin:0;font-size:15px;max-width:60ch}
.heading>div:last-child,.heading .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:10px 18px;min-height:44px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.25;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:all .18s ease}
.btn:hover{border-color:var(--gold);color:var(--navy);transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(16,24,40,.25)}
.btn.primary{background:linear-gradient(180deg,#16204a,var(--navy));border-color:var(--navy);color:#fff;box-shadow:0 8px 20px -10px rgba(10,17,40,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{background:linear-gradient(180deg,#1d2a5e,#101a3d);color:var(--gold2);border-color:var(--navy)}
.btn.soft{background:var(--goldsoft);border-color:#ecdcb9;color:#7a5c27}
.btn.danger{background:#fff;border-color:#f0d3d7;color:var(--ruby)}
.btn.danger:hover{background:#fdf2f3;border-color:var(--ruby);color:var(--ruby)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12.5px;border-radius:9px}
.panel .btn+.btn{margin-left:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:20px}
@media(max-width:1450px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat,.panel,.court-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stat{padding:22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-2px)}
.stat:first-child,.stat:last-child{background:linear-gradient(145deg,var(--navy),var(--navy2));border-color:var(--navy);color:#fff}
.stat:first-child .stat-top,.stat:last-child .stat-top,.stat:first-child small,.stat:last-child small{color:rgba(255,255,255,.62)}
.stat:first-child .stat-icon,.stat:last-child .stat-icon{background:rgba(217,189,133,.16);color:var(--gold2)}
.stat:first-child strong,.stat:last-child strong{color:#fff}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.stat-icon{width:34px;height:34px;display:grid;place-items:center;background:var(--goldsoft);color:var(--gold);border-radius:10px;font-weight:700;font-size:13px;flex:0 0 auto}
.stat strong{display:block;font:500 clamp(25px,2.2vw,32px) var(--serif);letter-spacing:-.02em;margin:14px 0 2px;color:var(--navy);overflow-wrap:anywhere}
.stat small{font-size:12px;color:var(--muted)}

/* Panels */
.panel{padding:26px;margin-bottom:20px;min-width:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.panelhead h3{margin:0;font:600 19px var(--serif);letter-spacing:-.01em;color:var(--navy)}
.panelhead>div:last-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:13px;line-height:1.55}
.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
.twocol>.panel{margin-bottom:0}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;background:#e6f4ee;color:var(--emerald)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:#fbf1dc;color:#8a6417}
.pill.confirmed,.pill.completed{background:#e2f5e9;color:#137a43}
.pill.rejected,.pill.cancelled{background:#fbe9ec;color:var(--ruby)}
.pill.unpaid{background:#eef0f4;color:#5b6475}

.range-filter{display:inline-flex;gap:5px;padding:4px;background:#f3f1eb;border:1px solid var(--line);border-radius:12px;margin:0 0 16px}.range-btn{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:9px;font:600 13px var(--sans);cursor:pointer;white-space:nowrap}.range-btn.active{background:var(--navy);color:#fff;box-shadow:0 3px 10px rgba(10,17,40,.15)}@media(max-width:680px){.earnings-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}.earnings-tabs .range-btn:last-child{grid-column:1/-1}}
/* Tables */
.tablewrap{width:100%;max-width:100%;overflow:visible}
.table{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed}
.table th,.table td{border-bottom:1px solid #f0ece2;padding:15px 12px;text-align:left;vertical-align:top;font-size:13.5px}
.table th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:6px}
.table tbody tr{transition:background .15s}.table tbody tr:hover{background:#fbfaf6}
.table tr:last-child td{border-bottom:0}
.table td strong{font-weight:600;color:var(--navy)}
.table th,.table td{overflow-wrap:anywhere;word-break:normal}
.table th:nth-child(1),.table td:nth-child(1){width:20%}.table th:nth-child(2),.table td:nth-child(2){width:13%}.table th:nth-child(3),.table td:nth-child(3){width:9%}.table th:nth-child(4),.table td:nth-child(4),.table th:nth-child(5),.table td:nth-child(5),.table th:nth-child(6),.table td:nth-child(6){width:10%}.table th:nth-child(7),.table td:nth-child(7){width:12%}.table th:nth-child(8),.table td:nth-child(8){width:16%}.table td .actions .btn{white-space:normal;padding:7px 9px;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:44px 16px;color:var(--muted);font-size:14px;background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(176,141,87,.04) 12px 24px);border:1px dashed var(--line);border-radius:12px}

/* Forms */
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field label{display:block;color:#4b5565;font-size:13px;font-weight:600;margin-bottom:7px}
.field input,.field select,.field textarea,.select{width:100%;border:1px solid #ddd7c9;border-radius:12px;padding:12px 14px;min-height:46px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.select{width:auto}
.field input:hover,.field select:hover,.field textarea:hover,.select:hover{border-color:#c9bfa6}
.field input:focus,.field select:focus,.field textarea:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(176,141,87,.16);outline:0}
.field input:disabled{background:#f6f4ef;color:var(--muted)}
.field textarea{resize:vertical;min-height:110px}
.field.full{grid-column:1/-1}
.field small{display:block;margin-top:6px;font-size:12px}
.formactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
input[type=file]{max-width:100%;font-size:13px;color:var(--muted)}
input[type=file]::file-selector-button{background:var(--goldsoft);color:#7a5c27;border:1px solid #ecdcb9;border-radius:8px;padding:7px 12px;margin-right:10px;font-weight:600;cursor:pointer}
.toggleline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #f0ece2}
.toggleline:last-child{border:0}
.toggle{accent-color:var(--navy);width:20px;height:20px}

/* Notices */
.notice{background:#f4f6fb;border:1px solid #dfe5f2;border-left:3px solid var(--navy);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.65;color:#3b4767;margin:16px 0}
.notice.gold{background:#fbf6ea;border-color:#efe2c2;border-left-color:var(--gold);color:#7a5c27}

/* Calendar */
.calendar{overflow:auto;-webkit-overflow-scrolling:touch}
.calendar table{border-collapse:separate;border-spacing:7px;min-width:720px;width:100%}
.calendar th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;font-weight:600}
.calendar td:first-child{font-size:12px;color:var(--muted);text-align:right;padding-right:10px;white-space:nowrap}
.calendar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.slot{width:100%;min-width:80px;min-height:44px;border:1px solid #e6e0d2;background:#faf8f3;color:#8a7a56;border-radius:10px;padding:9px 7px;font-size:12px;font-weight:600;line-height:1.35;transition:all .16s ease}
.slot:not(.booked):not(.blocked):hover,.slot:not(.booked):not(.blocked):focus-visible{background:var(--navy);border-color:var(--navy);color:var(--gold2);transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(10,17,40,.6)}
.slot.available{background:#d9f5e5;border-color:#9ad7b4;color:#11643d}.slot.available:hover{background:#bcebd0;border-color:#58b982;color:#084c2d}.slot.booked{background:#075b3b;border-color:#064b32;color:#fff}
.slot.booked:hover{background:var(--emerald);border-color:var(--emerald);color:#fff}
.slot.blocked{background:#b42332;border-color:#941b27;color:#fff}
.slot.blocked:hover{background:#4b5565;border-color:#4b5565;color:#fff}

/* Tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{border:0;background:transparent;padding:12px 16px;min-height:44px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}

/* Media */
.photo-preview{width:100%;height:200px;min-height:200px;border-radius:14px;background:#faf8f3;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font:600 14px var(--serif);letter-spacing:.2em;overflow:hidden;padding:8px;margin-top:8px}
.photo-preview img,.court-photo img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;object-position:center}
.photo-preview img{width:auto;height:auto}
.court-photo{height:200px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;overflow:hidden;display:grid;place-items:center;color:var(--muted);margin:10px 0}
.court-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.court-card{padding:18px;min-width:0;box-shadow:none}
.court-card h4{margin:0;font:600 17px var(--serif);color:var(--navy)}
.court-card .field{margin-top:10px}
.revenuebar{height:8px;background:#eee9dc;border-radius:20px;overflow:hidden}
.revenuebar span{height:100%;display:block;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:20px}

/* Toast / footer */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 22px;border-radius:14px;border:1px solid rgba(217,189,133,.35);box-shadow:0 18px 40px -12px rgba(10,17,40,.55);display:none;z-index:50;font-size:14px;max-width:calc(100vw - 28px);text-align:center}
.toast.show{display:block;animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.footer-note{font-size:12px;color:#9aa0ad;margin-top:22px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}

/* Mobile navigation toggle */
.mobile-menu-toggle{display:none;border:1px solid rgba(217,189,133,.35);background:rgba(255,255,255,.06);color:#fff;width:44px;height:42px;border-radius:10px;align-items:center;justify-content:center;flex-direction:column;gap:5px;cursor:pointer}
.mobile-menu-toggle span{display:block;width:21px;height:2px;background:currentColor;border-radius:2px}
/* Responsive */
@media(max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr)}.content{padding-left:24px;padding-right:24px}.table th,.table td{padding:10px 7px;font-size:12px}.table:has(td .actions){display:block}.table:has(td .actions) thead{display:none}.table:has(td .actions) tbody{display:grid;gap:10px}.table:has(td .actions) tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.table:has(td .actions) td{display:block;width:auto!important;padding:4px 2px;border:0;min-width:0}.table:has(td .actions) td:nth-child(1){grid-column:1/-1}.table:has(td .actions) td:last-child{grid-column:1/-1}.table:has(td .actions) td:last-child .actions{display:flex;justify-content:flex-start}.table:has(td .actions) td:last-child .btn{width:auto;min-width:116px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.content{padding:28px 24px 56px}.topbar{padding:0 24px}}
@media(max-width:900px) and (min-width:681px){.app{grid-template-columns:190px minmax(0,1fr)}.navbtn{font-size:13px;padding:11px 10px}.court-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){
 .app{display:block}
 .side{position:sticky;top:0;height:auto;z-index:30;padding:12px;border-right:0;border-bottom:1px solid rgba(217,189,133,.18);backdrop-filter:blur(16px);display:block}
 .side{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;column-gap:12px}
 .brand{font-size:22px;padding:0 6px 0}.brand-powered{grid-column:1;grid-row:2;padding-left:6px;margin-top:2px}.side small,.side-bottom{display:none}
 .mobile-menu-toggle{display:flex;grid-column:2;grid-row:1;}
 .navlist{display:none;grid-column:1/-1;flex-direction:column;overflow:visible;gap:5px;padding:12px 0 2px;scrollbar-width:none;width:100%}
 .side.menu-open .navlist{display:flex}
 .navbtn{width:100%;flex:0 0 auto;white-space:normal;text-align:left;font-size:14px;padding:12px 14px;background:rgba(255,255,255,.05)}
 .navbtn.active:before{display:none}
 .topbar{position:static;height:auto;min-height:64px;padding:12px 16px}.topbar h2{font-size:18px}.owner-email{display:none}
 .content{padding:22px 14px 40px}.heading{margin-bottom:20px}.heading h1{font-size:29px}.heading .btn{width:100%}
 .stats{gap:10px}.stat{padding:16px}.stat strong{font-size:clamp(21px,6vw,27px)}
 .panel{padding:18px;margin-bottom:14px}.formgrid{grid-template-columns:minmax(0,1fr);gap:16px}.field.full{grid-column:auto}
 .field input,.field select,.field textarea,.select{font-size:16px;min-height:48px}
 .formactions{display:grid;grid-template-columns:1fr}.formactions .btn{width:100%}
 .tabs{overflow-x:auto;flex-wrap:nowrap}.tab{flex:0 0 auto;white-space:nowrap}
 .court-cards{grid-template-columns:minmax(0,1fr)}.calendar table{border-spacing:5px}
}
</style>

<style id="courtly-table-layout-fix">
/* Reservation tables: no mid-word breaks, pills/amounts stay on one line, scroll instead of squeezing */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table th,.table td{overflow-wrap:normal!important;word-break:normal!important;width:auto!important}
.table td:first-child{overflow-wrap:anywhere!important}
.table td.nowrap,.table td.num{white-space:nowrap}
.table td .pill,.table td .actions .btn{white-space:nowrap}
.table td .actions{flex-wrap:nowrap}
.table td .actions .btn{padding:7px 14px!important;min-width:max-content}
.table th{line-height:1.5}
@media(min-width:1101px){.table{table-layout:auto!important;min-width:980px}}
/* Overview: give the reservations table room; side-by-side only on very wide screens */
.twocol{grid-template-columns:minmax(0,1fr)!important}
@media(min-width:2200px){.twocol{grid-template-columns:minmax(0,1.7fr) minmax(340px,.7fr)!important}}
/* Open Play transaction cards */
#opRecentTransactions article{padding:16px 18px!important}
.op-txn-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.op-txn-meta .pill{white-space:nowrap}
.op-txn-amount{font-weight:600!important}
#opRecentTransactions [data-op-review]{white-space:nowrap}
</style>
<style id="courtly-regular-type">body *{font-weight:400!important}h1,h2,h3,h4,h5,h6{font-weight:700!important}@media(max-width:680px){.content{padding:22px 14px 48px}.topbar{padding:0 14px;min-height:68px;height:auto}.heading{align-items:stretch;gap:12px;margin-bottom:20px}.heading>div:last-child,.heading .actions{width:100%;display:grid;grid-template-columns:1fr;gap:9px}.btn{width:100%;min-height:46px}.panel{min-width:0}.tablewrap{max-width:100%;overflow:visible}.table{min-width:0;table-layout:fixed}.table th,.table td{padding:9px 6px;font-size:11px}.table th{font-size:9px;letter-spacing:.04em}.table td .actions{display:grid;grid-template-columns:1fr;gap:5px}.table td .actions .btn{font-size:10px;padding:6px 4px;min-height:30px}.formgrid,.form-row{grid-template-columns:1fr!important}.statgrid,.stats{grid-template-columns:1fr 1fr!important;gap:10px}.stat{min-width:0;padding:13px}.navbtn{min-height:46px}.actions{display:grid;grid-template-columns:1fr;gap:8px}.actions .btn{width:100%}}
</style>

<style id="courtly-billing-ui">

const seed={openPlays:[],venue:{id:'kalinaw',name:'Kalinaw Courts',owner:'Demo Owner',email:'owner@courtly.demo',phone:'0917 123 4567',location:'Davao City, Philippines',sport:'Pickleball',description:'Premium pickleball courts for casual games, training, and group play.',slug:'kalinaw-courts',hoursOpen:'08:00',hoursClose:'22:00',baseRate:350,peakRate:450,courtCount:3,courtImages:[],logoData:'',coverData:'',paymentName:'QR Ph',paymentAccount:'Kalinaw Courts',paymentInstructions:'Please scan the venue QR code and include your booking reference in the payment note.',qrData:'',notifyEmail:true,notifyPending:true,notifyCancelled:true},bookings:[]};

};const selected=demoVenues[ACTIVE_DEMO],savedDemo=db.venue.id===ACTIVE_DEMO?db.venue:{};db.venue={...seed.venue,...selected,owner:'Demo Manager',email:'demo@courtly.ph',description:'Explore the Courtly owner portal using fictional sample data. Changes stay in this browser.',paymentName:'GCash QR',paymentAccount:'Courtly Demo',...savedDemo,id:ACTIVE_DEMO,slug:ACTIVE_DEMO,slugLocked:true,timezone:'Asia/Manila'};if(!Array.isArray(db.bookings)||db.bookings.length===0){const today=venueToday(),tomorrow=dateStr(plusDays(new Date(today+'T12:00:00'),1));db.bookings=[{id:'CT-DEMO-001',player:'Jordan Reyes',email:'jordan@example.com',date:today,time:'9:00 AM – 11:00 AM',duration:2,court:'Court 1',price:Number(selected.baseRate||350)*2,status:'Confirmed',paymentStatus:'Paid',createdAt:new Date().toISOString()},{id:'CT-DEMO-002',player:'Casey Santos',email:'casey@example.com',date:tomorrow,time:'4:00 PM – 5:00 PM',duration:1,court:'Court 2',price:Number(selected.baseRate||350),status:'Pending',paymentStatus:'Pending',createdAt:new Date().toISOString()}];}try{persist();}catch(error){console.warn('Demo changes cannot be saved in this browser:',error);}}
async function ownerLogout(){if(ACTIVE_DEMO){location.href='/login.html';return;}try{const result=await window.courtlySupabase?.auth.signOut();if(result?.error)throw result.error;location.replace('/login.html');}catch(error){toast(error.message||'Could not sign out. Please try again.');}}
function load(){if(!ACTIVE_DEMO)return structuredClone(seed);try{const saved=JSON.parse(localStorage.getItem(KEY));if(!saved?.venue||!Array.isArray(saved.bookings))return structuredClone(seed);return {...structuredClone(seed),...saved,venue:{...seed.venue,...saved.venue}}}catch(e){return structuredClone(seed)}}
function persist(change={}){if(ACTIVE_DEMO){localStorage.setItem(KEY,JSON.stringify(db));return Promise.resolve(true);}if(!workspaceReady||!window.courtlyPersistOwnerWorkspace)return Promise.reject(new Error('Your venue is not ready. Refresh the workspace and try again.'));return window.courtlyPersistOwnerWorkspace(db,change);}
function setOwnerBusy(busy){
 $('content')?.setAttribute('aria-busy',String(busy));
 document.querySelectorAll('.navbtn, #content button, #content input, #content select, #content textarea').forEach(control=>{
  if(busy){if(!control.disabled){control.dataset.ownerBusyDisabled='true';control.disabled=true;}}

 });

 });

function sortedBookings(){return db.bookings.slice().sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date));}
function publicVenueUrl(){return new URL('/v/'+encodeURIComponent(db.venue.slug||''),location.origin).href;}

function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),6000)}
function dateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function plusDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function bookingEndDate(b){
  if(b?.endsAt){const end=new Date(b.endsAt);if(!Number.isNaN(end.getTime()))return end;}
  if(!b?.date)return null;
  const date=String(b.date).slice(0,10), timeText=String(b.time||'');
  const matches=[...timeText.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/ig)];
  let end;
  if(matches.length){const m=matches[matches.length-1];let h=Number(m[1])%12;if(m[3].toUpperCase()==='PM')h+=12;end=new Date(`${date}T${String(h).padStart(2,'0')}:${m[2]||'00'}:00`)}
  else {const start=new Date(`${date}T00:00:00`);if(Number.isNaN(start.getTime()))return null;end=new Date(start.getTime()+Math.max(1,Number(b.duration||b.hours||1))*3600000)}
  return Number.isNaN(end.getTime())?null:end;
}
function isPastBooking(b){const end=bookingEndDate(b);return !!end&&end.getTime()<=Date.now()}
function displayBookingStatus(b){return b.status==='Confirmed'&&isPastBooking(b)?'Completed':b.status}
function statusPill(s){const cls=String(s).toLowerCase().replace(/[^a-z]+/g,'-');return `<span class="pill ${cls}">${esc(s)}</span>`}
function rangeStart(range=earningsRange){const now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(range==='30d')start.setDate(start.getDate()-29);else if(range==='1y')start.setFullYear(start.getFullYear()-1);else start.setDate(start.getDate()-6);return start}
function earningDate(b){const value=b.confirmedAt||b.paidAt||b.updatedAt||b.createdAt||b.date;if(!value)return null;const text=String(value);const d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(text)?`${text}T00:00:00`:text);return Number.isNaN(d.getTime())?null:d}
function inSelectedRange(b){const d=earningDate(b);if(!d)return false;const start=rangeStart();const end=new Date();end.setHours(23,59,59,999);return d>=start&&d<=end}

function updateOverviewGrossStats(){const op=typeof window.getCourtlyOpenPlayMetrics==='function'?window.getCourtlyOpenPlayMetrics():null;const openPlayRevenue=op?Number(op.revenue||0):(Number(String(document.getElementById('opEarnRevenue')?.textContent||'').replace(/[^0-9.]/g,''))||0);const openPlayBookings=op?Number(op.confirmedCount||0):(Number(String(document.getElementById('opEarnPaidCount')?.textContent||'').replace(/[^0-9]/g,''))||0);const courtRows=confirmed();const courtGross=courtRows.reduce((sum,b)=>sum+Number(b.price||0),0);const courtFee=courtRows.reduce((sum,b)=>sum+bookingFee(b),0);const playerPaidOpenPlayFees=op?Number(op.playerPaidFees||0):0;const legacyOpenPlayOwnerFees=op?Number(op.legacyOwnerFees||0):0;const totalCourtlyRemittance=courtFee+playerPaidOpenPlayFees+legacyOpenPlayOwnerFees;const combined=courtGross+openPlayRevenue;const ownerNet=combined-courtFee-legacyOpenPlayOwnerFees;const fmt=n=>money(n);const count=document.getElementById('overviewCourtBookings');const openCount=document.getElementById('overviewOpenPlayBookings');const grossNode=document.getElementById('overviewCombinedGross');const feeNode=document.getElementById('overviewTransactionFee');const totalNode=document.getElementById('overviewTotalGross');if(count)count.textContent=courtRows.length.toLocaleString('en-PH');if(openCount)openCount.textContent=openPlayBookings.toLocaleString('en-PH');if(grossNode)grossNode.textContent=fmt(combined);if(feeNode)feeNode.textContent=fmt(totalCourtlyRemittance);if(totalNode)totalNode.textContent=fmt(ownerNet)}

function render(){const titles={overview:'Overview',calendar:'Booking calendar',openplay:'Open play events',bookings:'Reservations',courts:'Courts & rates',transactions:'Earnings & transactions',venue:'Venue profile',payments:'Payment settings',billing:'Convenience Fees & Invoices',notifications:'Notifications'};$('pageTitle').textContent=titles[view];$('headerVenue').textContent=db.venue.name;const workspaceMode=$('workspaceModeLabel');if(workspaceMode)workspaceMode.textContent=ACTIVE_DEMO?'Demo workspace · saved in this browser':'Live venue workspace';const brand=$('sidebarBrand');if(brand)brand.innerHTML='<img class="courtly-brand-logo" src="/assets/courtly-logo.png" alt="Courtly">';$('avatar').textContent=(db.venue.owner||'CO').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const c=$('content');if(view==='overview')c.innerHTML=overview();if(view==='calendar')c.innerHTML=calendar();if(view==='openplay')c.innerHTML=openPlayPage();if(view==='bookings')c.innerHTML=bookingsPage();if(view==='courts')c.innerHTML=courtsPage();if(view==='transactions')c.innerHTML=transactionsPage();if(view==='venue')c.innerHTML=venuePage();if(view==='payments')c.innerHTML=paymentsPage();if(view==='billing')c.innerHTML=billingPage();if(view==='notifications')c.innerHTML=notificationsPage();if(window.loadOpenPlayTransactions)setTimeout(()=>{if(view==='overview'||view==='bookings'||view==='transactions')window.loadOpenPlayTransactions()},0);if((view==='openplay'||view==='transactions'||(view==='overview'&&earningsSection==='openplay'))&&window.refreshOpenPlayRegistrationCounts)setTimeout(()=>window.refreshOpenPlayRegistrationCounts(),0);setTimeout(updateOverviewGrossStats,0);if(view==='billing')setTimeout(()=>window.loadCourtlyOwnerBilling?.(),0);document.querySelectorAll('.navbtn[data-view]').forEach(button=>{const active=button.dataset.view===view;button.classList.toggle('active',active);if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');});prepareOwnerTables();if(view==='bookings')filterBookings();if(ownerBusy)setOwnerBusy(true)}

egistrations…</div></section>`;

return `${heading('Good morning, '+esc(db.venue.owner.split(' ')[0]||'Owner'),'Here is what is happening at '+esc(db.venue.name)+'.',`<button class="btn primary" onclick="go('calendar')">＋ Manage calendar</button>`)}${earningsTabs()}${earningsSection==='openplay'?openPlayOverview:courtOverview}`;

function openPlayPage(){db.openPlays=db.openPlays||[];const items=db.openPlays.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));return `${heading('Open play','Create public open-play sessions and promote them on your Courtly booking page.',`<span class="pill">${items.filter(x=>x.active!==false).length} published</span>`)}<section class="panel"><div class="panelhead"><h3>Create an open play banner</h3><span class="pill">Player announcement</span></div><form onsubmit="saveOpenPlay(event)"><div class="formgrid"><div class="field full"><label>Banner image</label><input id="opImage" type="file" accept="image/*" onchange="previewOpenPlayImage(this)"><div id="opImagePreview" class="photo-preview">Upload a landscape banner image</div><small class="muted">JPG, PNG or WebP · up to 100 MB. Recommended 16:9 landscape.</small></div><div class="field full"><label>Open play title *</label><input id="opTitle" required maxlength="100" placeholder="e.g. Saturday Social Pickleball"></div><div class="field full"><label>Details *</label><textarea id="opDetails" rows="3" required maxlength="500" placeholder="Tell players what to expect, skill level, format, and what to bring."></textarea></div><div class="field"><label>When — date *</label><input id="opDate" type="date" required min="${venueToday()}"></div><div class="field"><label>Start time *</label><input id="opTime" type="time" required></div><div class="field"><label>Where *</label><input id="opWhere" required maxlength="180" value="${esc(db.venue.location||'')}" placeholder="Venue / court location"></div><div class="field"><label>Registration amount per player (₱) *</label><input id="opFee" type="number" min="0" step="1" required placeholder="e.g. 150"><small class="muted">A ₱10 Convenience Fee is added to paid registrations at checkout. Free events (₱0) have no transaction fee.</small></div><div class="field"><label>Registration limit *</label><input id="opLimit" type="number" min="1" step="1" required value="20" placeholder="e.g. 20"></div></div><div class="formactions"><button class="btn primary">＋ Publish open play</button></div></form><div class="notice gold">Pricing: players pay your published registration amount plus a ₱10 Convenience Fee for paid Open Play registrations. The player-paid fee is collected through your venue QR for Courtly and tracked for remittance; it is not deducted from your event registration revenue. Free events have no Convenience Fee. Published announcements appear above the date selector on this venue's public booking page. The Register now button takes players to the booking calendar. Saved event details, images and registration limits appear on your public venue page.</div></section><section class="panel"><div class="panelhead"><h3>Your open play announcements</h3><span class="muted small">${items.length} total</span></div>${items.length?`<div class="court-cards">${items.map(x=>`<article class="court-card" style="cursor:default"><div style="height:150px;border-radius:10px;overflow:hidden;background:#eef1f5">${x.image?`<img src="${x.image}" style="width:100%;height:100%;object-fit:cover">`:'<div style="padding:55px 12px;text-align:center">COURTLY OPEN PLAY</div>'}</div><div style="padding:12px 4px"><div class="eyebrow">${x.active===false?'UNPUBLISHED':'PUBLISHED'} · ${esc(x.date)}</div><h3 style="margin:6px 0">${esc(x.title)}</h3><p class="muted small">${esc(x.details)}</p><p class="small">${esc(x.time)} · ${esc(x.where)} · ${money(x.fee)} / player</p><p class="small"><strong data-op-count="${esc(x.id)}">${Number(x.registeredCount||0)} / ${Number(x.limit||20)}</strong> registered · <span class="muted" data-op-spots="${esc(x.id)}">${Math.max(0,Number(x.limit||20)-Number(x.registeredCount||0))} spots available</span></p><div class="actions"><button class="btn sm" onclick="toggleOpenPlay('${x.id}')">${x.active===false?'Publish':'Unpublish'}</button><button class="btn danger sm" onclick="deleteOpenPlay('${x.id}')">Delete</button></div></div></article>`).join('')}</div>`:'<div class="empty">No open play announcements yet. Create your first banner above.</div>'}</section>`}
let openPlayImage='';function previewOpenPlayImage(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>100*1024*1024){toast('Choose an image up to 100 MB.');input.value='';return}compressImageFile(f,1600,.78).then(data=>{openPlayImage=data;$('opImagePreview').innerHTML=`<img src="${openPlayImage}" style="width:100%;height:100%;object-fit:cover">`}).catch(()=>toast('Could not process this image. Please try another file.'))}
async function saveOpenPlay(e){
 e.preventDefault();if(ownerBusy)return;
 const item={id:crypto.randomUUID(),title:$('opTitle').value.trim(),details:$('opDetails').value.trim(),date:$('opDate').value,time:$('opTime').value,where:$('opWhere').value.trim(),fee:Number($('opFee').value),limit:Number($('opLimit').value),registeredCount:0,registrationRefs:[],image:openPlayImage,active:true,createdAt:new Date().toISOString()};
 if(!item.title||!item.details||!item.where){toast('Enter a title, details and location for your session.');return;}
 if(!Number.isFinite(item.fee)||item.fee<0||!Number.isInteger(item.limit)||item.limit<1){toast('Enter a valid price and a registration limit of at least one player.');return;}
 return ownerAction(async()=>{
  db.openPlays=db.openPlays||[];db.openPlays.push(item);
  try{await persist({scope:'openPlay',id:item.id});openPlayImage='';render();toast(ACTIVE_DEMO?'Demo Open Play event saved in this browser.':'Open Play event published on your venue page.');}
  catch(error){db.openPlays=db.openPlays.filter(event=>event.id!==item.id);throw error;}
 });
}
async function toggleOpenPlay(id){
 const item=(db.openPlays||[]).find(event=>event.id===id);if(!item||ownerBusy)return;
 return ownerAction(async()=>{const previous=item.active;item.active=previous===false;try{await persist({scope:'openPlay',id});render();toast(item.active?'Open Play published.':'Open Play unpublished.');}catch(error){item.active=previous;throw error;}});
}
async function deleteOpenPlay(id){
 if(ownerBusy||!(db.openPlays||[]).some(event=>event.id===id))return;
 if(!confirm('Delete this Open Play announcement? This removes the event. Unpublish it instead if you need to keep its registrations.'))return;
 return ownerAction(async()=>{await persist({scope:'openPlay',id,remove:true});db.openPlays=db.openPlays.filter(event=>event.id!==id);if(ACTIVE_DEMO)await persist();render();toast('Open Play announcement deleted.');});
}

function bookingsPage(){const rows=sortedBookings();return `${heading('Reservations','Court rentals and Open Play registrations in one place. Use the Type label to distinguish each reservation.',`<button class="btn" onclick="exportCsv()">↓ Export court bookings</button>`)}<section class="panel"><div class="panelhead"><h3>All reservations</h3><select class="select" id="bookingFilter" aria-label="Filter reservations by status" onchange="filterBookings()">${['All statuses','Pending','Confirmed','Completed','Cancelled','Awaiting verification','Rejected'].map(status=>`<option ${bookingFilterValue===status?'selected':''}>${status}</option>`).join('')}</select></div><div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Reference / Player</th><th>Date & time</th><th>Court / Event</th><th>Registration amount</th><th>Convenience Fee & payer</th><th>Venue net</th><th>Status</th><th>Actions</th></tr></thead><tbody id="unifiedReservationRows">${rows.map(b=>`<tr data-reservation-status="${esc(displayBookingStatus(b))}"><td><span class="pill">Court Rental</span></td><td><strong>${esc(b.reference||b.id)}</strong><br>${esc(b.player)}<br><span class="muted">${esc(b.email)}</span></td><td>${esc(b.date)}<br>${esc(b.time)}</td><td>${esc(b.court)}</td><td>${money(b.price)}</td><td>${money(['Confirmed','Completed'].includes(displayBookingStatus(b))?bookingFee(b):0)}<br><span class="muted small">Owner-paid Convenience Fee</span></td><td><strong>${money(['Confirmed','Completed'].includes(displayBookingStatus(b))?Number(b.price||0)-bookingFee(b):0)}</strong></td><td>${statusPill(displayBookingStatus(b))}<br><span class="muted small">${esc(b.paymentStatus||'')}</span>${b.paymentScreenshotUrl?`<br><a class="btn sm" href="${esc(b.paymentScreenshotUrl)}" target="_blank" rel="noopener noreferrer">View receipt ↗</a>`:''}</td><td><div class="actions">${b.status==='Pending'?`<button class="btn primary sm" onclick="confirmPay('${b.id}')">Confirm paid</button>`:''}${!['Cancelled','Rejected','Expired'].includes(b.status)?`<button class="btn danger sm" onclick="cancel('${b.id}')">Cancel</button>`:''}</div></td></tr>`).join('')}<tr id="unifiedOpenPlayLoading"><td colspan="9" class="muted small">Loading Open Play reservations…</td></tr></tbody></table></div></section>${renderCommunityActivityPaymentQueue()}`}
function filterBookings(){
 const select=$('bookingFilter');if(!select)return;
 bookingFilterValue=select.value;
 let visible=0;
 document.querySelectorAll('#unifiedReservationRows tr[data-reservation-status]').forEach(row=>{row.hidden=!(bookingFilterValue==='All statuses'||row.dataset.reservationStatus===bookingFilterValue);if(!row.hidden)visible++;});
 let empty=$('reservationFilterEmpty');
 if(!empty){empty=document.createElement('p');empty.id='reservationFilterEmpty';empty.className='empty';$('unifiedReservationRows')?.closest('.tablewrap')?.after(empty);}
 empty.hidden=visible>0||Boolean($('unifiedOpenPlayLoading'));
 empty.textContent=bookingFilterValue==='All statuses'?'No reservations yet. Share your booking page to start receiving bookings.':'No reservations match this status. Choose another status to view more bookings.';
}
function timeMinutes(value){const text=String(value||'').trim();const match=text.match(/^(\d{1,2}):(\d{2})(?:\s*(AM|PM))?/i);if(!match)return null;let hour=Number(match[1]);const minute=Number(match[2]);if(minute>59||hour>23)return null;if(match[3]){hour=hour%12+(match[3].toUpperCase()==='PM'?12:0);}return hour*60+minute;}
function calendarRange(item){
 const midnight=Date.parse(String(item.date||'')+'T00:00:00Z');
 const minutes=Number.isFinite(item.startMinutes)?item.startMinutes:timeMinutes(item.time);
 if(!Number.isFinite(midnight)||minutes==null)return null;
 const start=midnight+minutes*60000;
 const end=item.endDate&&Number.isFinite(item.endMinutes)?Date.parse(item.endDate+'T00:00:00Z')+item.endMinutes*60000:start+Number(item.duration||1)*3600000;
 return end>start?{start,end}:null;
}
function activeCourtNames(){const courts=(db.courts||[]).filter(c=>c.is_active!==false);return courts.length?courts.map(c=>c.name):Array.from({length:Number(db.venue.courtCount||0)},(_,i)=>db.venue.courtImages?.[i]?.name||'Court '+(i+1));}
function calendarSlot(date,court,time,duration=1){
 const start=Date.parse(date+'T00:00:00Z')+timeMinutes(time)*60000,end=start+duration*3600000;
 const overlaps=item=>{const range=calendarRange(item);return item.court===court&&range&&range.start<end&&start<range.end;};
 return {booking:db.bookings.find(item=>['Pending','Confirmed','Completed'].includes(item.status)&&overlaps(item)),block:(db.blocks||[]).find(overlaps)};
}
function venueToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:db.venue.timezone||'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=name=>parts.find(p=>p.type===name)?.value;return `${part('year')}-${part('month')}-${part('day')}`;}
function calendarToday(){calendarDate=new Date(venueToday()+'T12:00:00');render();}
function setCalendarDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return;const date=new Date(value+'T12:00:00');if(!Number.isNaN(date.getTime())){calendarDate=date;render();}}
function setCalendarMode(mode){calendarMode=mode==='day'?'day':'week';render();}
function calendar(){
 const start=new Date(calendarDate);if(calendarMode==='week')start.setDate(start.getDate()-((start.getDay()+6)%7));
 const days=Array.from({length:calendarMode==='day'?1:7},(_,i)=>plusDays(start,i));
 const open=timeMinutes(db.venue.hoursOpen),close=timeMinutes(db.venue.hoursClose),times=[];
 if(open!=null&&close!=null)for(let minute=open;minute<close;minute+=60)times.push(minute);
 const allCourts=activeCourtNames();if(calendarCourt!=='All courts'&&!allCourts.includes(calendarCourt))calendarCourt='All courts';
 const courts=calendarCourt==='All courts'?allCourts:[calendarCourt],step=calendarMode==='day'?1:7;
 const arg=value=>esc(JSON.stringify(String(value)));
 const dateLabel=calendarMode==='day'?days[0].toLocaleDateString('en-PH',{weekday:'long',month:'short',day:'numeric',year:'numeric'}):`${days[0].toLocaleDateString('en-PH',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}`;

function formatTime(value){const minute=timeMinutes(value);if(minute==null)return '';const hour=Math.floor(minute/60);return `${hour%12||12}:${String(minute%60).padStart(2,'0')} ${hour>=12?'PM':'AM'}`;}
function moveWeek(n){calendarDate=plusDays(calendarDate,n);render();}
async function blockSlot(date,court,time,duration=1){
 if(ownerBusy)return;
 const current=calendarSlot(date,court,time,duration);if(current.booking||current.block){toast('This time is no longer available. Refresh the calendar.');return;}
 if(!confirm(`Block ${court} on ${date} at ${time}?`))return;
 return ownerAction(async()=>{
  const block={id:crypto.randomUUID(),date,court,time,duration,reason:'Unavailable'};
  db.blocks=db.blocks||[];db.blocks.push(block);
  try{await persist({scope:'block',id:block.id});render();toast(ACTIVE_DEMO?'Demo time slot blocked in this browser.':'Time slot blocked.');}
  catch(error){db.blocks=db.blocks.filter(item=>item.id!==block.id);render();throw error;}
 });
}
async function unblock(id){
 if(ownerBusy)return;
 const block=(db.blocks||[]).find(item=>item.id===id);if(!block)return;
 if(!confirm(`Make ${block.court} available again on ${block.date} at ${block.time}?`))return;
 return ownerAction(async()=>{await persist({scope:'block',id,remove:true});db.blocks=db.blocks.filter(item=>item.id!==id);if(ACTIVE_DEMO)await persist();render();toast('Time block removed.');});
}

ross devices.</div><button type="button" class="btn" onclick="go('courts')">Manage court count and rates</button></section>`}
function compressImageFile(file,maxDimension=1600,quality=.8,mime='image/jpeg'){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,maxDimension/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL(mime,mime==='image/png'?undefined:quality))};img.src=reader.result};reader.readAsDataURL(file)})}
async function dataUrlHasTransparency(dataUrl){
 return new Promise((resolve,reject)=>{
  const img=new Image();img.onerror=reject;
  img.onload=()=>{
   try{
    const canvas=document.createElement('canvas');canvas.width=96;canvas.height=96;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.clearRect(0,0,96,96);ctx.drawImage(img,0,0,96,96);
    const pixels=ctx.getImageData(0,0,96,96).data;let transparent=false;
    for(let i=3;i<pixels.length;i+=4){if(pixels[i]<245){transparent=true;break;}}
    resolve(transparent);
   }catch(error){reject(error);}
  };
  img.src=dataUrl;
 });
}
async function previewImage(input,target){
 const file=input.files?.[0];if(!file||ownerBusy)return;
 const isLogo=target==='logoPreview',maxBytes=isLogo?10*1024*1024:100*1024*1024;
 if(file.size>maxBytes||!file.type.startsWith('image/')){toast(isLogo?'Choose a PNG logo up to 10 MB.':'Choose an image up to 100 MB.');input.value='';return;}
 if(isLogo&&file.type!=='image/png'){toast('Upload a PNG logo with a transparent background.');input.value='';return;}
 return ownerAction(async()=>{
  const key=isLogo?'logoData':target==='qrPreview'?'qrData':'coverData',previous=db.venue[key];
  try{
   const mime=target==='qrPreview'||isLogo?'image/png':'image/jpeg';
   const data=await compressImageFile(file,isLogo?1200:target==='qrPreview'?1800:1600,target==='qrPreview'?.92:.8,mime);
   if(isLogo&&!(await dataUrlHasTransparency(data)))throw new Error('This PNG has a solid background. Remove the background and upload a transparent PNG.');
   db.venue[key]=data;
   await persist({scope:target==='qrPreview'?'payments':'profile'});
   const box=$(target);if(box){box.innerHTML=`<img src="${esc(db.venue[key]||data)}" alt="${isLogo?'Venue logo':target==='qrPreview'?'Venue payment QR':'Venue cover'}">`;if(isLogo)autoLogoContrast(box,db.venue[key]||data);}
   toast(ACTIVE_DEMO?'Demo image saved in this browser.':target==='qrPreview'?'Payment QR saved.':'Venue image saved.');
  }catch(error){db.venue[key]=previous;throw error;}
  finally{if(input.isConnected)input.value='';}
 });
}

function autoLogoContrast(box,data){const img=new Image();img.onload=()=>{let light=0,total=0;try{const canvas=document.createElement('canvas');canvas.width=40;canvas.height=40;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,40,40);const px=ctx.getImageData(0,0,40,40).data;for(let i=0;i<px.length;i+=4){if(px[i+3]<30)continue;total++;if(px[i]>205&&px[i+1]>205&&px[i+2]>205)light++}}catch(e){}box.style.background=(total&&light/total>0.22)?'#0a1128':'#faf8f3';box.style.borderColor='#8ED502';};img.src=data}

 if(!values.name||!values.owner||!values.email||!values.location||!values.city){toast('Complete the required venue details before saving.');return;}

}

function paymentsPage(){const v=db.venue;return `${heading('Payment settings','Configure payment instructions that players see after making a booking.')}<section class="panel"><div class="panelhead"><h3>Venue payment method</h3><span class="pill">Venue checkout settings</span></div><form onsubmit="savePayment(event)"><div class="formgrid"><div class="field"><label>Payment method label</label><select id="payName">${['QR Ph','GCash QR','Maya QR','Bank transfer','Cash at venue','Other'].map(s=>`<option ${v.paymentName===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Account / recipient name</label><input id="payAccount" value="${esc(v.paymentAccount)}" placeholder="Account name"></div><div class="field full"><label>Payment instructions for players</label><textarea id="payInstructions" rows="3">${esc(v.paymentInstructions)}</textarea></div><div class="field full"><label>Venue payment QR code (shown to players at checkout)</label><input id="payQr" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewImage(this,'qrPreview')"><div id="qrPreview" class="photo-preview" style="background:#fff;border:1px dashed #d9cfb6">${v.qrData?`<img src="${v.qrData}" alt="Saved venue payment QR code">`:'＋ Upload official GCash / payment QR image'}</div><small class="muted">PNG, JPG, or WebP · Maximum 100 MB. After saving, this QR is displayed in the public page's PAY NOW checkout for this venue.</small></div></div><div class="formactions"><button class="btn primary">Save payment settings</button></div></form><div class="notice gold">Courtly cannot verify QR payments automatically yet. For launch, connect a payment provider with payment notifications/webhooks or use a manual review workflow before confirming bookings.</div></section>`}
async function savePayment(e){
 e.preventDefault();if(ownerBusy)return;
 const values={paymentName:$('payName').value,paymentAccount:$('payAccount').value.trim(),paymentInstructions:$('payInstructions').value.trim()};
 return ownerAction(async()=>{const previous={paymentName:db.venue.paymentName,paymentAccount:db.venue.paymentAccount,paymentInstructions:db.venue.paymentInstructions};Object.assign(db.venue,values);try{await persist({scope:'payments'});render();toast(ACTIVE_DEMO?'Demo payment settings saved in this browser.':'Payment settings saved for public checkout.');}catch(error){Object.assign(db.venue,previous);throw error;}});
}

function notificationsPage(){const v=db.venue;return `${heading('Notifications','Choose which booking events should trigger email notifications.')}<form class="panel" onsubmit="saveNotifications(event)"><div class="panelhead"><h3>Email preferences</h3><span class="pill pending">Email delivery not connected</span></div><div class="field"><label>Notification recipient</label><input value="${esc(v.email)}" disabled><small class="muted">Update your business email in Venue profile.</small></div><div class="toggleline"><div><strong>Booking confirmation emails</strong><div class="muted small">Notify the player and venue when a booking is confirmed.</div></div><input class="toggle" id="notifyEmail" type="checkbox" ${v.notifyEmail?'checked':''}></div><div class="toggleline"><div><strong>New booking requests</strong><div class="muted small">Notify the owner when a new reservation is submitted.</div></div><input class="toggle" id="notifyPending" type="checkbox" ${v.notifyPending?'checked':''}></div><div class="toggleline"><div><strong>Cancellation alerts</strong><div class="muted small">Notify the owner when a reservation is cancelled.</div></div><input class="toggle" id="notifyCancelled" type="checkbox" ${v.notifyCancelled?'checked':''}></div><div class="formactions"><button class="btn primary">Save preferences</button></div></form><div class="notice">Preferences are stored in Supabase. Actual email delivery still requires an email service and backend integration.</div>`}
async function saveNotifications(e){
 e.preventDefault();if(ownerBusy)return;
 const values={notifyEmail:$('notifyEmail').checked,notifyPending:$('notifyPending').checked,notifyCancelled:$('notifyCancelled').checked};
 return ownerAction(async()=>{const previous={notifyEmail:db.venue.notifyEmail,notifyPending:db.venue.notifyPending,notifyCancelled:db.venue.notifyCancelled};Object.assign(db.venue,values);try{await persist({scope:'notifications'});toast(ACTIVE_DEMO?'Demo preferences saved in this browser.':'Notification preferences saved.');}catch(error){Object.assign(db.venue,previous);throw error;}});
}

function renderCommunityActivityPaymentQueue(){
 const rows=db.communityActivityPayments||[];
 const pending=rows.filter(r=>r.payment_status==='awaiting_verification').length;
 const body=rows.map(r=>{
  const d=new Date(r.starts_at);
  const date=d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',year:'numeric',month:'short',day:'numeric'});
  const time=d.toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'});
  const status=r.payment_status==='confirmed'?(r.registration_status==='confirmed'?'Confirmed':'Paid · Waitlisted'):r.payment_status==='rejected'?'Rejected':'Awaiting verification';
  const receipt=r.receiptUrl?'<a class="btn sm" href="'+esc(r.receiptUrl)+'" target="_blank" rel="noopener">View receipt ↗</a>':'<span class="muted small">No receipt required</span>';
  const actions=r.payment_status==='awaiting_verification'
   ?'<button class="btn primary sm" onclick="confirmActivityPayment(\''+esc(r.registration_id)+'\')">Approve payment</button><button class="btn danger sm" onclick="rejectActivityPayment(\''+esc(r.registration_id)+'\')">Reject</button>'
   :'';
  return '<tr><td><strong>'+esc(r.event_title)+'</strong><br><span class="muted small">'+esc(r.sport)+' · '+esc(r.court_name)+'</span></td><td>'+esc(r.player_name)+'<br><span class="muted small">'+esc(r.player_email)+'</span></td><td>'+esc(date)+'<br>'+esc(time)+'</td><td>'+money(r.amount)+'</td><td>'+esc(r.payment_method||'—')+'<br><span class="muted small">'+esc(r.payment_reference||'')+'</span></td><td>'+statusPill(status)+'</td><td>'+receipt+'</td><td><div class="actions">'+actions+'</div></td></tr>';
 }).join('');
 const empty='<tr><td colspan="8" class="muted small">No player-hosted activity registrations for your venue yet.</td></tr>';
 return '<section class="panel"><div class="panelhead"><div><h3>Player-hosted activity payments</h3><p class="muted small">Players choosing your venue submit their payment proof here. Approving payment confirms their place if capacity is available.</p></div><span class="pill '+(pending?'pending':'confirmed')+'">'+pending+' awaiting verification</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Activity / court</th><th>Player</th><th>Date &amp; time</th><th>Amount</th><th>Payment details</th><th>Status</th><th>Proof</th><th>Actions</th></tr></thead><tbody>'+(body||empty)+'</tbody></table></div></section>';
}
async function confirmActivityPayment(registrationId){
 const row=(db.communityActivityPayments||[]).find(item=>String(item.registration_id)===String(registrationId));
 if(!row||ownerBusy||row.payment_status!=='awaiting_verification')return;
 if(!confirm('Verify this payment? The player will be confirmed if a spot is available.'))return;
 return ownerAction(async()=>{
  const result=ACTIVE_DEMO?{registration_status:'confirmed'}:await window.courtlyReviewCommunityActivityPayment(registrationId,'confirmed');
  row.payment_status='confirmed';row.registration_status=result?.registration_status||row.registration_status;
  if(ACTIVE_DEMO)await persist();render();
  toast(row.registration_status==='confirmed'?'Payment approved. Player added to the confirmed roster.':'Payment approved. Player is paid and waitlisted because the activity is full.');
 });
}
async function rejectActivityPayment(registrationId){
 const row=(db.communityActivityPayments||[]).find(item=>String(item.registration_id)===String(registrationId));
 if(!row||ownerBusy||row.payment_status!=='awaiting_verification')return;
 if(!confirm('Reject this payment proof? The player can submit a corrected receipt.'))return;
 return ownerAction(async()=>{if(!ACTIVE_DEMO)await window.courtlyReviewCommunityActivityPayment(registrationId,'rejected');row.payment_status='rejected';row.registration_status='rejected';if(ACTIVE_DEMO)await persist();render();toast('Payment rejected. The player can submit a new receipt.');});
}
async function confirmPay(id){
 const booking=db.bookings.find(item=>String(item.id)===String(id));if(!booking||ownerBusy)return;
 if(booking.status!=='Pending'){toast('This reservation is no longer awaiting confirmation.');return;}
 return ownerAction(async()=>{
  if(!ACTIVE_DEMO)await window.courtlyReviewBooking(id,'confirmed');
  const previous={status:booking.status,paymentStatus:booking.paymentStatus,confirmedAt:booking.confirmedAt};
  booking.status='Confirmed';booking.paymentStatus='Paid';booking.confirmedAt=new Date().toISOString();
  try{if(ACTIVE_DEMO)await persist();}catch(error){Object.assign(booking,previous);throw error;}
  render();toast(ACTIVE_DEMO?'Demo payment marked as paid in this browser.':`Payment confirmed. ${money(bookingFee(booking))} Convenience Fee deducted from owner earnings.`);
 });
}
async function cancel(id){
 const booking=db.bookings.find(item=>String(item.id)===String(id));if(!booking||ownerBusy||['Cancelled','Rejected','Expired'].includes(booking.status))return;
 if(!confirm('Cancel this reservation?'))return;
 return ownerAction(async()=>{if(!ACTIVE_DEMO)await window.courtlyCancelBooking(id);const previous=booking.status;booking.status='Cancelled';try{if(ACTIVE_DEMO)await persist();}catch(error){booking.status=previous;throw error;}render();toast(ACTIVE_DEMO?'Demo reservation cancelled in this browser.':'Reservation cancelled.');});
}
function previewBooking(){
 if(!workspaceReady||!db.venue.slug){toast('Wait for your venue to finish loading.');return;}
 const link=document.createElement('a');link.href=publicVenueUrl();link.target='_blank';link.rel='noopener noreferrer';link.click();
}
function exportCsv(){
 const bookings=sortedBookings().filter(booking=>view==='transactions'?['Confirmed','Completed'].includes(booking.status)&&inSelectedRange(booking):view!=='bookings'||bookingFilterValue==='All statuses'||displayBookingStatus(booking)===bookingFilterValue);
 const rows=[['Booking reference','Player','Email','Date','Time','Court','Court rental gross','Convenience Fee (owner)','Owner net','Status'],...bookings.map(booking=>{const paid=['Confirmed','Completed'].includes(booking.status);return [booking.reference||booking.id,booking.player,booking.email,booking.date,booking.time,booking.court,booking.price,paid?bookingFee(booking):0,paid?Number(booking.price||0)-bookingFee(booking):0,displayBookingStatus(booking)];})];
 const csv=rows.map(row=>row.map(value=>{let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return `"${text.replace(/"/g,'""')}"`;}).join(',')).join('\r\n');
 const blob=new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8;'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='courtly-court-reservations.csv';link.click();URL.revokeObjectURL(link.href);toast('Court booking CSV export prepared.');
}

if(ACTIVE_DEMO){window.addEventListener('message',function(event){
 if(event.origin!==location.origin||!event.data||event.data.type!=='courtly-demo-booking-created'||!event.data.booking)return;
 const incoming=event.data.booking;
 if(String(incoming.slug||'')!==String(db.venue.slug||''))return;
 const id=String(incoming.id||('CT-'+Date.now()));
 if(db.bookings.some(b=>b.id===id))return;
 db.bookings.push({id,player:'Online customer',email:'Not collected in demo',date:incoming.date,time:incoming.time,duration:Math.min(8,Math.max(1,Number(incoming.duration||1))),court:'Court '+Number(incoming.court||1),price:Number(incoming.price||db.venue.baseRate||0),status:'Pending',paymentMethod:incoming.method||'Not specified',createdAt:incoming.createdAt||new Date().toISOString()});
 persist();render();toast('New booking received from the public preview.');
});}
async function initializeOwnerPortal(){
 if(ACTIVE_DEMO){workspaceReady=true;calendarDate=new Date(venueToday()+'T12:00:00');render();return;}
 workspaceReady=false;
 try{
  if(!window.courtlyBridgeReady)await new Promise((resolve,reject)=>{
   const ready=()=>{clearTimeout(timer);resolve(true);};
   const timer=setTimeout(()=>{window.removeEventListener('courtly-bridge-ready',ready);reject(new Error('The connection is taking too long. Please try again.'));},10000);
   window.addEventListener('courtly-bridge-ready',ready,{once:true});
  });
  const loaded=await window.courtlyLoadOwnerWorkspace();db=loaded;window.courtlyOwnerState=db;workspaceReady=true;calendarDate=new Date(venueToday()+'T12:00:00');render();
 }catch(error){
  console.warn('Owner workspace could not be loaded:',error);
  $('workspaceModeLabel').textContent='Workspace unavailable';
  $('content').innerHTML=`<section class="panel" role="alert"><h2>Unable to load your venue</h2><p>${esc(error.message||'Check your connection and try again.')}</p><div class="actions"><button class="btn primary" onclick="initializeOwnerPortal()">Try again</button><a class="btn" href="/login.html">Owner login</a></div></section>`;
 }
}

initializeOwnerPortal();
</script>
