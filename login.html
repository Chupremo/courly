<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Login | Courtly</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0a1530;color:#f7f9ff;font-family:Inter,Arial,sans-serif}.card{width:min(100%,460px);padding:34px;background:#fff;color:#172342;border-radius:20px;box-shadow:0 24px 80px #0005}.brand{font-weight:950;font-size:24px;letter-spacing:-1px;color:#122b61}.brand span{color:#e0474b}h1{margin:26px 0 8px;font-size:30px;letter-spacing:-.8px}p{color:#65718a;line-height:1.6;font-size:14px}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.field input{width:100%;padding:13px 14px;border:1px solid #d7deeb;border-radius:10px;font:inherit}.submit{width:100%;border:0;border-radius:10px;padding:14px;background:#1747ad;color:white;font-weight:900;font-size:14px;cursor:pointer}.msg{display:none;padding:12px;margin-top:14px;background:#fff0f0;color:#a72a2a;border-radius:9px;font-size:13px;line-height:1.5}.msg.show{display:block}.links{margin-top:20px;text-align:center;font-size:13px}.links a{color:#1747ad;font-weight:800;text-decoration:none}.note{font-size:11px;background:#f2f5fa;padding:12px;border-radius:8px;margin-top:18px}</style></head><body><main class="card"><a class="brand" href="/" style="text-decoration:none">COURT<span>LY</span></a><h1>Welcome back</h1><p>Log in to manage your venue, courts, bookings, and earnings.</p><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="username" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password"></div><button class="submit" type="submit">Log in to owner portal →</button><div id="msg" class="msg" role="alert"></div></form><div class="links">New to Courtly? <a href="/#owner-signup">Create an owner account</a></div><div class="note">Prototype login: accounts are stored in this browser only. Secure sign-in across devices requires Supabase Auth. Do not use a password you use elsewhere.</div></main><script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const msg=document.getElementById('msg');try{const accounts=JSON.parse(localStorage.getItem('courtly_owner_accounts_demo')||'{}');const account=accounts[email];if(!account||account.password!==password){msg.textContent='We could not find an account with that email and password in this browser. Please sign up here or use the same browser where you registered.';msg.classList.add('show');return;}localStorage.setItem('courtly_owner_session_demo',email);localStorage.setItem('courtly_owner_profile_demo',JSON.stringify(account));window.location.href='/owner-portal.html';}catch(err){msg.textContent='Unable to log in with this browser. Please try again.';msg.classList.add('show');}});</script></body></html>
