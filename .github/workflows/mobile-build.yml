name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'public/mobile-runtime.js'
      - 'public/**'
      - '*.html'
      - '*.js'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: courtly-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Refresh dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve mobile dependencies
        run: npm install --ignore-scripts
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: courtly-package-lock
          path: package-lock.json
          retention-days: 7
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update mobile dependency lockfile"
          git push

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build Courtly web bundle
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Generate approved Courtly Android icons
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: courtly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Build Courtly web bundle
        run: npm run build
      - name: Create iOS project
        run: npx cap add ios
      - name: Generate approved Courtly iOS icons
        run: npx @capacitor/assets generate --ios --assetPath assets --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Compile for iOS Simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
