<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#001A47"><title>Club Login | Courtly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/courtly-global-nav.css?v=clubs-20261106"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172744;font:14px Inter,Arial}.card{width:min(460px,calc(100% - 32px));margin:60px auto;padding:30px;background:#fff;border:1px solid #e3eaf3;border-radius:18px;box-shadow:0 18px 45px #001a4710}.card h1{font:700 28px Poppins;color:#001A47;margin:0 0 8px}.card p{color:#687891;line-height:1.6}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input{width:100%;height:46px;border:1px solid #d7e0ec;border-radius:9px;padding:0 12px;font:14px Inter}.submit{width:100%;height:48px;border:0;border-radius:9px;background:#8ED502;color:#172900;font-weight:800;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px;font-size:12px;line-height:1.5}.msg.show{display:block}.error{background:#fff0f0;color:#a72b35}.success{background:#eaf8ef;color:#176b44}.below{text-align:center;color:#687891;font-size:12px;margin-top:18px}.below a{color:#001A47;font-weight:700}</style></head><body><header id="courtlyGlobalHeader" class="courtly-global-header"></header><main class="card"><h1>Welcome back</h1><p>Log in to manage your Courtly sports club profile.</p><form id="form"><div class="field"><label for="email">Club email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="submit" id="submit" type="submit">Log in to club account</button><div class="msg" id="message" role="alert" aria-live="polite"></div></form><div class="below">New to Courtly? <a href="/club-register.html">Register your club</a><br><a href="/browse-clubs.html">Browse clubs</a></div></main><script type="module">import{supabase,supabaseConfigError}from'./supabase-client.js';const $=id=>document.getElementById(id),form=$('form'),btn=$('submit'),msg=$('message');function show(t,type='error'){msg.textContent=t;msg.className='msg show '+type}form.addEventListener('submit',async e=>{e.preventDefault();if(!supabase){show(supabaseConfigError);return}btn.disabled=true;try{const{data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('password').value});if(error)throw error;const type=String(data.user?.user_metadata?.account_type||'').toLowerCase();const{data:club}=await supabase.from('club_profiles').select('id').eq('id',data.user.id).maybeSingle();if(type!=='club'&&type!=='sports_club'&&!club){await supabase.auth.signOut();throw new Error('This account is not registered as a Courtly club account. Please use the correct login page.')}show('Login successful. Opening Browse Clubs…','success');location.assign('/club-dashboard.html')}catch(err){show(err.message||'Unable to log in.')}finally{btn.disabled=false}});</script><script type="module" src="/courtly-global-nav.js?v=clubs-20261106"></script></body></html>
